<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <p>Тема: <strong id="topic"></strong></p>
  <label for="draft">Черновик ответа</label>
  <textarea id="draft" rows="6" readonly></textarea>
  <script type="module">
    const form = document.querySelector("form");
    const status = document.querySelector("#status");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const button = form.querySelector("button[type=submit]");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      topic.textContent = "";
      draft.value = "";
      button.disabled = true;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();

        if (data.status === "ready") {
          topic.textContent = data.topic;
          draft.value = data.draft;
          status.textContent = "Черновик готов. Проверьте перед отправкой.";
        } else if (data.status === "manual_review") {
          topic.textContent = "";
          draft.value = "";
          status.textContent = "AI не смог разобрать заявку. Разберите её вручную.";
        } else if (data.status === "invalid_input") {
          topic.textContent = "";
          draft.value = "";
          status.textContent = "Введите текст заявки.";
        } else {
          topic.textContent = "";
          draft.value = "";
          status.textContent = "Сервис недоступен. Разберите заявку вручную.";
        }
      } catch {
        topic.textContent = "";
        draft.value = "";
        status.textContent = "Сервис недоступен. Разберите заявку вручную.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
